[project]
name = "tracelens"
version = "0.1.0"
description = "Local trace investigator for Claude Code and Codex sessions: archive, index in DuckDB, rule signals, report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4.2"]

[project.scripts]
tracelens = "tracelens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens"]
